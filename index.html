<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모과제 : 모든 과제를 제시간 안에</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .custom-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        .task-item { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2 rounded-xl flex items-center justify-center w-10 h-10 shadow-md">
                    <i class="fa-solid fa-list-check text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">모과제</h1>
                    <p class="text-xs text-slate-500 font-medium">모든 과제를 제시간 안에</p>
                </div>
            </div>
            <button onclick="resetAllData()" class="text-xs text-slate-400 hover:text-rose-500 transition-colors flex items-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> 초기화
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">

        <!-- Step 1: 과제 입력 -->
        <section class="bg-white rounded-2xl p-6 custom-shadow border border-slate-100">
            <div class="flex items-center space-x-3 mb-6">
                <span class="w-8 h-8 rounded-full bg-brand-100 text-brand-600 font-bold flex items-center justify-center text-sm">1</span>
                <h2 class="text-lg font-bold text-slate-800">해야 할 과제 입력하기</h2>
            </div>

            <!-- Task Form -->
            <form id="taskForm" class="space-y-4 mb-6" onsubmit="handleAddTask(event)">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                    <!-- Task Name -->
                    <div class="md:col-span-4">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">과제 이름</label>
                        <input type="text" id="taskName" placeholder="예: 수학 워크북 12~15p" required
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all text-sm">
                    </div>
                    <!-- Deadline / Context -->
                    <div class="md:col-span-3">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">제출 마감 / 학원 스케줄</label>
                        <input type="text" id="taskDeadline" placeholder="예: 오늘 첫 학원 전, 내일 1교시" required
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all text-sm">
                    </div>
                    <!-- Estimated Time -->
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">예상 시간(분)</label>
                        <input type="number" id="taskTime" min="5" max="300" step="5" placeholder="예: 30" required
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all text-sm">
                    </div>
                    <!-- Importance Level -->
                    <div class="md:col-span-3">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">중요도</label>
                        <select id="taskImportance" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all text-sm">
                            <option value="3">🔥 높음 (수행평가/시험 범위)</option>
                            <option value="2" selected>⭐ 보통 (일반 매일 숙제)</option>
                            <option value="1">🌱 낮음 (간단한 제출물/확인)</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm flex items-center gap-2 transition-all shadow-sm hover:shadow active:scale-[0.99]">
                        <i class="fa-solid fa-plus"></i> 과제 추가하기
                    </button>
                </div>
            </form>

            <!-- Task List Display -->
            <div class="border-t border-slate-100 pt-4">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-semibold text-slate-700">등록된 과제 목록 (<span id="taskCount" class="text-brand-600">0</span>개)</h3>
                </div>
                <div id="taskList" class="space-y-2">
                    <div id="emptyTaskNotice" class="text-center py-8 text-slate-400 text-sm bg-slate-50/50 rounded-xl border border-dashed border-slate-200">
                        <i class="fa-regular fa-folder-open text-2xl mb-2 text-slate-300 block"></i>
                        아직 등록된 과제가 없습니다. 위에서 과제를 입력해 보세요!
                    </div>
                </div>
            </div>
        </section>

        <!-- Step 2: 나의 숙제 스타일 분석 -->
        <section class="bg-white rounded-2xl p-6 custom-shadow border border-slate-100">
            <div class="flex items-center space-x-3 mb-6">
                <span class="w-8 h-8 rounded-full bg-brand-100 text-brand-600 font-bold flex items-center justify-center text-sm">2</span>
                <h2 class="text-lg font-bold text-slate-800">나의 숙제 스타일 & 시간대 선택</h2>
            </div>

            <div class="space-y-6">
                <!-- Style Options -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-3">숙제 해결 스타일을 선택하세요</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Style A -->
                        <label class="relative flex flex-col p-4 rounded-xl border-2 border-slate-200 cursor-pointer hover:border-brand-500 transition-all group bg-white has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50/30">
                            <input type="radio" name="stylePreference" value="quick" class="sr-only" checked>
                            <div class="flex justify-between items-start mb-2">
                                <span class="p-2 rounded-lg bg-amber-100 text-amber-600 text-lg">⚡</span>
                                <span class="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center group-has-[:checked]:border-brand-600 group-has-[:checked]:bg-brand-600 text-white text-xs">
                                    <i class="fa-solid fa-check"></i>
                                </span>
                            </div>
                            <span class="font-bold text-slate-800 text-sm mb-1">최대한 빨리 끝낼 수 있는 순서</span>
                            <span class="text-xs text-slate-500 leading-relaxed">
                                걸리는 시간이 짧은 과제부터 빠르게 처리하여 성취감을 높이고 부담을 줄입니다. (Quick Wins 스타일)
                            </span>
                        </label>

                        <!-- Style B -->
                        <label class="relative flex flex-col p-4 rounded-xl border-2 border-slate-200 cursor-pointer hover:border-brand-500 transition-all group bg-white has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50/30">
                            <input type="radio" name="stylePreference" value="important" class="sr-only">
                            <div class="flex justify-between items-start mb-2">
                                <span class="p-2 rounded-lg bg-emerald-100 text-emerald-600 text-lg">🎯</span>
                                <span class="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center group-has-[:checked]:border-brand-600 group-has-[:checked]:bg-brand-600 text-white text-xs">
                                    <i class="fa-solid fa-check"></i>
                                </span>
                            </div>
                            <span class="font-bold text-slate-800 text-sm mb-1">중요도가 높은 과제 순서</span>
                            <span class="text-xs text-slate-500 leading-relaxed">
                                에너지와 집중력이 가장 좋을 때 중요한 과제(수행평가 등)를 먼저 해결합니다. (Eat That Frog 스타일)
                            </span>
                        </label>
                    </div>
                </div>

                <!-- Preferred Time Slots Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-2">오늘 활용할 수 있는 자투리/공부 시간대 (복수 선택 가능)</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
                        <label class="flex items-center p-3 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:bg-slate-100 transition-all text-xs font-medium text-slate-700 has-[:checked]:bg-brand-50 has-[:checked]:border-brand-300 has-[:checked]:text-brand-700">
                            <input type="checkbox" id="timeMorning" checked class="mr-2 rounded text-brand-600 focus:ring-brand-500">
                            <span>🌅 아침 자습 시간</span>
                        </label>
                        <label class="flex items-center p-3 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:bg-slate-100 transition-all text-xs font-medium text-slate-700 has-[:checked]:bg-brand-50 has-[:checked]:border-brand-300 has-[:checked]:text-brand-700">
                            <input type="checkbox" id="timeBreak" checked class="mr-2 rounded text-brand-600 focus:ring-brand-500">
                            <span>🍱 쉬는시간/점심시간</span>
                        </label>
                        <label class="flex items-center p-3 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:bg-slate-100 transition-all text-xs font-medium text-slate-700 has-[:checked]:bg-brand-50 has-[:checked]:border-brand-300 has-[:checked]:text-brand-700">
                            <input type="checkbox" id="timeAfterschool" checked class="mr-2 rounded text-brand-600 focus:ring-brand-500">
                            <span>🏠 하교 후 집 (저녁)</span>
                        </label>
                        <label class="flex items-center p-3 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:bg-slate-100 transition-all text-xs font-medium text-slate-700 has-[:checked]:bg-brand-50 has-[:checked]:border-brand-300 has-[:checked]:text-brand-700">
                            <input type="checkbox" id="timeNight" class="mr-2 rounded text-brand-600 focus:ring-brand-500">
                            <span>🌙 밤 / 야간 시간</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <div class="mt-8">
                <button onclick="generateSchedule()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-6 rounded-xl text-sm flex items-center justify-center gap-2 shadow-md transition-all active:scale-[0.99]">
                    <i class="fa-solid fa-wand-magic-sparkles text-brand-400"></i> 스마트 순서 & 스케줄 도출하기
                </button>
            </div>
        </section>

        <!-- Step 3 & 4: 분석 결과 도출 -->
        <section id="resultSection" class="hidden bg-white rounded-2xl p-6 custom-shadow border border-slate-100">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                <div class="flex items-center space-x-3">
                    <span class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 font-bold flex items-center justify-center text-sm">3</span>
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">최적의 숙제 실행 스케줄</h2>
                        <p class="text-xs text-slate-500">선택하신 스타일과 시간에 맞춘 추천 일정입니다.</p>
                    </div>
                </div>
                <div class="bg-slate-100 px-3 py-1.5 rounded-lg text-right">
                    <span class="text-[10px] text-slate-500 uppercase font-semibold block">총 소요 예상 시간</span>
                    <span id="totalTimeBadge" class="text-sm font-bold text-slate-800">0분</span>
                </div>
            </div>

            <!-- Tailored Productivity Tip Box -->
            <div id="tipBox" class="mb-6 p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs leading-relaxed text-slate-700 flex items-start gap-3">
                <i class="fa-solid fa-lightbulb text-amber-500 text-base mt-0.5"></i>
                <div id="tipContent"></div>
            </div>

            <!-- Generated Schedule Result List -->
            <div class="space-y-4 mb-6">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">추천 실행 순서</h3>
                <div id="scheduleList" class="space-y-3"></div>
            </div>

            <!-- Progress tracker bar -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-slate-700">진행 상황</span>
                    <span id="progressText" class="text-xs font-bold text-brand-600">0% 완료 (0/0)</span>
                </div>
                <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-brand-600 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- Custom Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-lg text-xs flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-info text-brand-400"></i>
        <span id="toastMsg">알림 메시지</span>
    </div>

    <script>
        let tasks = [];

        const taskForm = document.getElementById('taskForm');
        const taskNameInput = document.getElementById('taskName');
        const taskDeadlineInput = document.getElementById('taskDeadline');
        const taskTimeInput = document.getElementById('taskTime');
        const taskImportanceInput = document.getElementById('taskImportance');
        const taskListContainer = document.getElementById('taskList');
        const taskCountEl = document.getElementById('taskCount');
        const emptyNotice = document.getElementById('emptyTaskNotice');
        const resultSection = document.getElementById('resultSection');

        function handleAddTask(e) {
            e.preventDefault();
            const name = taskNameInput.value.trim();
            const deadline = taskDeadlineInput.value.trim();
            const time = parseInt(taskTimeInput.value);
            const importance = parseInt(taskImportanceInput.value);

            if (!name || !deadline || isNaN(time) || time <= 0) return;

            const newTask = {
                id: Date.now(),
                name: name,
                deadline: deadline,
                time: time,
                importance: importance,
                completed: false
            };

            tasks.push(newTask);
            renderTasks();

            taskNameInput.value = '';
            taskDeadlineInput.value = '';
            taskTimeInput.value = '';
            taskNameInput.focus();

            showToast('과제가 추가되었습니다.');
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
            showToast('과제가 삭제되었습니다.');
            resultSection.classList.add('hidden');
        }

        function getImportanceBadge(level) {
            switch(level) {
                case 3: return `<span class="bg-rose-50 text-rose-600 border border-rose-200 px-2 py-0.5 rounded-md text-[11px] font-semibold">높음</span>`;
                case 2: return `<span class="bg-amber-50 text-amber-600 border border-amber-200 px-2 py-0.5 rounded-md text-[11px] font-semibold">보통</span>`;
                case 1: return `<span class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-0.5 rounded-md text-[11px] font-semibold">낮음</span>`;
                default: return '';
            }
        }

        function renderTasks() {
            taskCountEl.textContent = tasks.length;

            if (tasks.length === 0) {
                emptyNotice.classList.remove('hidden');
                taskListContainer.innerHTML = '';
                taskListContainer.appendChild(emptyNotice);
                return;
            }

            emptyNotice.classList.add('hidden');
            taskListContainer.innerHTML = '';

            tasks.forEach(task => {
                const el = document.createElement('div');
                el.className = 'task-item bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex items-center justify-between hover:bg-slate-100/80 transition-colors';
                el.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-2 h-2 rounded-full ${task.importance === 3 ? 'bg-rose-500' : task.importance === 2 ? 'bg-amber-500' : 'bg-emerald-500'}"></div>
                        <div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <p class="text-sm font-semibold text-slate-800 truncate">${escapeHtml(task.name)}</p>
                                <span class="bg-indigo-50 text-indigo-600 border border-indigo-100 px-2 py-0.5 rounded-md text-[11px] font-medium"><i class="fa-regular fa-clock text-[10px]"></i> ${escapeHtml(task.deadline)}</span>
                            </div>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs text-slate-500"><i class="fa-solid fa-hourglass-half text-[10px]"></i> ${task.time}분</span>
                                ${getImportanceBadge(task.importance)}
                            </div>
                        </div>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="text-slate-400 hover:text-rose-500 p-2 rounded-lg transition-colors">
                        <i class="fa-regular fa-trash-can text-sm"></i>
                    </button>
                `;
                taskListContainer.appendChild(el);
            });
        }

        function generateSchedule() {
            if (tasks.length === 0) {
                showToast('먼저 최소 1개 이상의 과제를 입력해주세요!');
                return;
            }

            const stylePref = document.querySelector('input[name="stylePreference"]:checked').value;
            
            const activeSlots = [];
            if (document.getElementById('timeMorning').checked) activeSlots.push({ key: 'morning', name: '🌅 아침 자습 시간', maxCap: 25, idealType: 'quick' });
            if (document.getElementById('timeBreak').checked) activeSlots.push({ key: 'break', name: '🍱 쉬는시간/점심시간', maxCap: 15, idealType: 'quick' });
            if (document.getElementById('timeAfterschool').checked) activeSlots.push({ key: 'afterschool', name: '🏠 하교 후 집 (저녁)', maxCap: 120, idealType: 'focus' });
            if (document.getElementById('timeNight').checked) activeSlots.push({ key: 'night', name: '🌙 밤 / 야간 시간', maxCap: 90, idealType: 'focus' });

            if (activeSlots.length === 0) {
                showToast('활용 가능한 시간대를 최소 1개 이상 선택해주세요!');
                return;
            }

            let sortedTasks = [...tasks];

            if (stylePref === 'quick') {
                sortedTasks.sort((a, b) => a.time - b.time || b.importance - a.importance);
            } else {
                sortedTasks.sort((a, b) => b.importance - a.importance || a.time - b.time);
            }

            const scheduledTasks = sortedTasks.map((task, index) => {
                const recommendedContext = assignRecommendedSlot(task, activeSlots, stylePref);
                return {
                    ...task,
                    order: index + 1,
                    recommendedContext: recommendedContext
                };
            });

            renderResults(scheduledTasks, stylePref);
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function assignRecommendedSlot(task, activeSlots, stylePref) {
            if (task.time <= 15) {
                const breakSlot = activeSlots.find(s => s.key === 'break');
                if (breakSlot) return { slotName: breakSlot.name, note: '짧게 끊어 하기 편함 (쉬는시간 강추)' };
                const morningSlot = activeSlots.find(s => s.key === 'morning');
                if (morningSlot) return { slotName: morningSlot.name, note: '하루 시동 걸기용 적합' };
            }

            if (task.importance === 3 || task.time >= 40) {
                const homeSlot = activeSlots.find(s => s.key === 'afterschool');
                if (homeSlot) return { slotName: homeSlot.name, note: '높은 몰입도가 필요한 핵심 과제' };
                const nightSlot = activeSlots.find(s => s.key === 'night');
                if (nightSlot) return { slotName: nightSlot.name, note: '조용한 야간 환경 추천' };
            }

            const defaultSlot = activeSlots[0];
            return { slotName: defaultSlot.name, note: '추천 실행 시간' };
        }

        function renderResults(scheduledTasks, stylePref) {
            const scheduleList = document.getElementById('scheduleList');
            const totalTimeBadge = document.getElementById('totalTimeBadge');
            const tipContent = document.getElementById('tipContent');

            scheduleList.innerHTML = '';
            let totalMinutes = 0;

            scheduledTasks.forEach(task => {
                totalMinutes += task.time;

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border transition-all ${task.completed ? 'bg-slate-50 border-slate-200 opacity-60' : 'bg-white border-slate-200 shadow-sm hover:border-brand-300'}`;
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-start space-x-3">
                            <input type="checkbox" onchange="toggleTaskComplete(${task.id})" ${task.completed ? 'checked' : ''} 
                                class="mt-1 h-4 w-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500 cursor-pointer">
                            <div>
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="bg-slate-100 text-slate-700 font-bold px-2 py-0.5 rounded text-xs">#${task.order}</span>
                                    <h4 class="font-bold text-slate-800 text-sm ${task.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(task.name)}</h4>
                                    ${getImportanceBadge(task.importance)}
                                    <span class="bg-indigo-50 text-indigo-600 border border-indigo-100 px-2 py-0.5 rounded-md text-[11px] font-medium"><i class="fa-regular fa-clock text-[10px]"></i> 마감: ${escapeHtml(task.deadline)}</span>
                                </div>
                                
                                <div class="flex flex-wrap items-center gap-y-1 gap-x-3 mt-2 text-xs text-slate-500">
                                    <span><i class="fa-solid fa-hourglass-half text-slate-400"></i> 소요: <strong>${task.time}분</strong></span>
                                    <span class="text-slate-300">|</span>
                                    <span class="text-brand-600 font-medium"><i class="fa-regular fa-calendar-check"></i> ${task.recommendedContext.slotName}</span>
                                    <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[11px]">${task.recommendedContext.note}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                scheduleList.appendChild(card);
            });

            const hours = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            totalTimeBadge.textContent = hours > 0 ? `${hours}시간 ${mins}분` : `${mins}분`;

            if (stylePref === 'quick') {
                tipContent.innerHTML = `
                    <strong class="font-bold text-slate-800">⚡ 빠른 성취 중심 (Quick Wins) 가이드:</strong><br>
                    시간이 짧게 걸리는 숙제부터 차례대로 해결하며 마감 기한전에 빠르게 체크하세요! 완료할 때마다 체크박스를 지워나가면 마감 압박감이 훨씬 줄어듭니다.
                `;
            } else {
                tipContent.innerHTML = `
                    <strong class="font-bold text-slate-800">🎯 중요 과제 우선 (Eat That Frog) 가이드:</strong><br>
                    마감 일정 및 학원 제출 시간에 대비해 중요도 높은 과제부터 우선적으로 완성해보세요! 핵심 숙제를 먼저 끝내놓으면 마음 편하게 남은 시간을 활용할 수 있습니다.
                `;
            }

            updateProgress();
        }

        function toggleTaskComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                generateSchedule();
            }
        }

        function updateProgress() {
            if (tasks.length === 0) return;
            const completedCount = tasks.filter(t => t.completed).length;
            const percent = Math.round((completedCount / tasks.length) * 100);

            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').textContent = `${percent}% 완료 (${completedCount}/${tasks.length})`;
        }

        function resetAllData() {
            if (tasks.length > 0 && !confirm('모든 과제 데이터를 초기화하시겠습니까?')) {
                return;
            }
            tasks = [];
            renderTasks();
            resultSection.classList.add('hidden');
            showToast('데이터가 초기화되었습니다.');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
